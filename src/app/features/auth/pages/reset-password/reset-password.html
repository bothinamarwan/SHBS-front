<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Reset Password
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Please enter your new password below.
      </p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
          <input id="password" name="password" type="password" required
            formControlName="password"
            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="New Password"
            [class.border-red-500]="password?.invalid && password?.touched">
        </div>
        <div>
          <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm New Password</label>
          <input id="confirm-password" name="confirmPassword" type="password" required
            formControlName="confirmPassword"
            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="Confirm Password"
            [class.border-red-500]="confirmPassword?.invalid && confirmPassword?.touched">
        </div>
      </div>

      <div *ngIf="confirmPassword?.errors?.['mismatch'] && confirmPassword?.touched" class="text-red-500 text-xs mt-1">
        Passwords do not match.
      </div>

      <div *ngIf="successMessage()" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
        <span class="block sm:inline">{{ successMessage() }}</span>
      </div>

      <div>
        <button type="submit" [disabled]="isLoading() || resetForm.invalid"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50">
          Reset Password
        </button>
      </div>
    </form>
  </div>
</div>
