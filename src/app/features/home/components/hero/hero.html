<!-- Hero Section -->
<section class="relative h-[870px] flex items-center justify-center px-6 overflow-hidden">
  <!-- Background Image -->
  <div class="absolute inset-0 z-0">
    <img
      alt="Modern student common room"
      class="w-full h-full object-cover"
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2XUAwy_tdsROxrlqO4WNrkpMHoTgCZetF8-bzHDoVehHHBYqBqasjCVmSZ5bcGLF8GDDl8FU1WtMOJY6bTOXUpx8kQ3dQlh9lA12ItIMFypHCxXc7XJZfetN0mi4kRbzNjA6rHtC5h4d_37lkF57t6tSBYtBpL7zWDOafcQELfRZMsgzMa2mbvVhlmSz14eTM5qIOOXXNci_xM2cHEAl3inGMhIXL8pTF8G9BrdrZiC4_IaKmy-iYVcAWZ9UXBSEgk2XgZ_MExJE"
    />
    <!-- Gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-black/70"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 w-full max-w-3xl text-center flex flex-col items-center gap-8">

    <!-- Badge -->
    <div class="hero-badge">
      <span class="material-symbols-outlined" style="font-size:14px;">auto_awesome</span>
      Student Housing Simplified
    </div>

    <!-- Headline -->
    <h1 class="font-headline text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight drop-shadow-2xl">
      Find Your Perfect<br/>
      <span class="hero-gradient-text">UniStay</span>
    </h1>

    <!-- Sub -->
    <p class="text-white/70 text-base md:text-lg font-medium max-w-md">
      Verified student housing near top Egyptian universities — search, compare, and book in minutes.
    </p>

    <!-- ── UNIFIED PILL SEARCH BAR ── -->
    <div class="search-pill">

      <!-- Location -->
      <div class="search-field">
        <span class="material-symbols-outlined search-icon">location_on</span>
        <div class="search-field-inner">
          <label class="search-label">Location</label>
          <input class="search-input" placeholder="Near any university…" type="text"/>
        </div>
      </div>

      <div class="search-sep"></div>

      <!-- Budget -->
      <div class="search-field">
        <span class="material-symbols-outlined search-icon">payments</span>
        <div class="search-field-inner">
          <label class="search-label">Max Budget</label>
          <input class="search-input" placeholder="EGP / month" type="number"/>
        </div>
      </div>

      <div class="search-sep"></div>

      <!-- Room Type -->
      <div class="search-field">
        <span class="material-symbols-outlined search-icon">bed</span>
        <div class="search-field-inner">
          <label class="search-label">Room Type</label>
          <select class="search-input search-select">
            <option value="">Any type</option>
            <option>Studio</option>
            <option>Shared Apartment</option>
            <option>En-suite</option>
          </select>
        </div>
      </div>

      <!-- Search Button -->
      <a routerLink="/listings" class="search-btn">
        <span class="material-symbols-outlined" style="font-size:20px;">search</span>
        <span class="search-btn-text">Search</span>
      </a>
    </div>

    <!-- Quick stats -->
    <div class="hero-stats">
      <div class="hero-stat">
        <span class="hero-stat-num">2,400+</span>
        <span class="hero-stat-lbl">Listings</span>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <span class="hero-stat-num">120+</span>
        <span class="hero-stat-lbl">Universities</span>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <span class="hero-stat-num">98%</span>
        <span class="hero-stat-lbl">Verified</span>
      </div>
    </div>

  </div>
</section>
