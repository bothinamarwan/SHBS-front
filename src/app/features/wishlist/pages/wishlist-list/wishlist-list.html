<div class="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-black text-neutral-800">Your Wishlist</h1>
      <p class="text-neutral-500 mt-1">Stays you've saved for later</p>
    </div>
    <button *ngIf="items().length > 0" class="text-rose-600 font-bold text-sm hover:underline">Clear all</button>
  </div>

  <div *ngIf="isLoading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let i of [1,2,3]" class="animate-pulse">
      <div class="bg-neutral-200 h-48 rounded-3xl mb-4"></div>
      <div class="h-4 bg-neutral-100 rounded w-3/4 mb-2"></div>
      <div class="h-4 bg-neutral-50 rounded w-1/2"></div>
    </div>
  </div>

  <div *ngIf="!isLoading() && items().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let item of items()" class="bg-white rounded-3xl overflow-hidden border border-neutral-100 shadow-sm hover:shadow-xl transition-all group">
      <div class="relative h-48">
        <img [src]="item.images[0]" class="w-full h-full object-cover" [alt]="item.title">
        <button (click)="removeItem(item)" class="absolute top-4 right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-500 shadow-lg hover:scale-110 transition-transform">
          <i class="fas fa-heart"></i>
        </button>
      </div>
      <div class="p-6">
        <h3 class="font-bold text-neutral-800 mb-2">{{ item.title }}</h3>
        <p class="text-neutral-500 text-xs mb-6 flex items-center gap-1">
          <i class="fas fa-map-marker-alt"></i> {{ item.area }}
        </p>
        <div class="flex items-center justify-between">
          <span class="text-indigo-600 font-black">{{ item.price | number }} EGP</span>
          <a [routerLink]="['/student/housing', item.id]" class="text-neutral-800 text-sm font-bold hover:text-indigo-600 transition-colors">View Stay</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && items().length === 0" class="bg-white py-24 rounded-[3rem] border border-dashed border-neutral-200 flex flex-col items-center">
    <div class="w-20 h-20 bg-neutral-50 rounded-full flex items-center justify-center mb-6 text-neutral-300">
      <i class="fas fa-heart-broken text-3xl"></i>
    </div>
    <h3 class="text-xl font-bold text-neutral-800">Your wishlist is empty</h3>
    <p class="text-neutral-500 mt-2">You haven't saved any student housing yet.</p>
    <a routerLink="/student/search" class="mt-8 text-indigo-600 font-bold flex items-center gap-2 hover:underline">
      Go to Search <i class="fas fa-arrow-right text-xs"></i>
    </a>
  </div>
</div>
