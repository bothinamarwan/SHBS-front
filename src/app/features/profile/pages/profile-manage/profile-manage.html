<div class="max-w-4xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
  <h1 class="text-3xl font-black text-neutral-800 dark:text-slate-100">My Profile</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Sidebar: Profile Preview -->
    <div class="space-y-6">
      <div class="bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] border border-neutral-100 dark:border-slate-800 shadow-xl dark:shadow-none flex flex-col items-center text-center">
        <div class="relative group cursor-pointer group">
          <img [src]="(user | async)?.avatarUrl" class="w-32 h-32 rounded-full border-4 border-white shadow-lg group-hover:brightness-50 transition-all" alt="">
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <i class="fas fa-camera text-white text-2xl"></i>
          </div>
        </div>
        <h3 class="mt-6 text-xl font-black text-neutral-800 dark:text-slate-100">{{ (user | async)?.name }}</h3>
        <p class="text-sm text-neutral-400 dark:text-slate-500 font-medium uppercase tracking-widest">{{ (user | async)?.role }}</p>
        
        <div class="mt-8 pt-8 border-t border-neutral-50 dark:border-slate-800 w-full space-y-4">
           <div class="flex justify-between items-center text-sm font-medium">
              <span class="text-neutral-400 dark:text-slate-500">Status</span>
              <span class="text-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">Active</span>
           </div>
           <div class="flex justify-between items-center text-sm font-medium">
              <span class="text-neutral-400 dark:text-slate-500">Joined</span>
              <span class="text-neutral-800 dark:text-slate-300">April 2026</span>
           </div>
        </div>
      </div>

      <div class="bg-indigo-600 p-6 rounded-[2rem] text-white shadow-xl shadow-indigo-100 dark:shadow-none">
        <h4 class="font-bold mb-2">Need help?</h4>
        <p class="text-indigo-100 text-xs leading-relaxed mb-4">Contact our support team for any privacy or data concerns.</p>
        <button class="w-full bg-white text-indigo-600 py-3 rounded-xl text-xs font-bold hover:bg-neutral-50 transition-colors">Contact Support</button>
      </div>
    </div>

    <!-- Main Form -->
    <div class="md:col-span-2 space-y-8">
      <div class="bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-[2.5rem] border border-neutral-100 dark:border-slate-800 shadow-xl dark:shadow-none">
        <h3 class="text-xl font-bold text-neutral-800 dark:text-slate-100 mb-8">Personal Information</h3>
        
        <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Full Name</label>
              <input type="text" formControlName="name"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Phone Number</label>
              <input type="text" formControlName="phone"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Email Address</label>
              <input type="email" formControlName="email"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">National ID</label>
              <input type="text" formControlName="nationalID"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Gender</label>
              <select formControlName="gender"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Date of Birth</label>
              <input type="date" formControlName="dateOfBirth"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="sm:col-span-2 space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Permanent Address</label>
              <input type="text" formControlName="address"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">City</label>
              <input type="text" formControlName="city"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Preferred Area</label>
              <input type="text" formControlName="preferredArea"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
          </div>

          <div class="pt-8 flex justify-end">
            <button type="submit" [disabled]="isLoading() || profileForm.invalid"
              class="px-12 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100 dark:shadow-none disabled:opacity-50">
              Save Changes
            </button>
          </div>
        </form>
      </div>

      <!-- Password Change -->
      <div class="bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-[2.5rem] border border-neutral-100 dark:border-slate-800 shadow-xl dark:shadow-none">
        <h3 class="text-xl font-bold text-neutral-800 dark:text-slate-100 mb-8">Change Password</h3>
        
        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-6">
          <div class="space-y-2">
            <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Current Password</label>
            <input type="password" formControlName="current"
              class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">New Password</label>
              <input type="password" formControlName="new"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
              <label class="block text-[10px] font-bold text-neutral-400 dark:text-slate-500 uppercase tracking-widest px-2">Confirm New Password</label>
              <input type="password" formControlName="confirm"
                class="w-full px-6 py-4 bg-neutral-50 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-2xl font-bold text-neutral-800 dark:text-slate-100 focus:bg-white dark:focus:bg-slate-700 focus:border-indigo-500 transition-all">
            </div>
          </div>

          <div class="pt-8 flex justify-end">
            <button type="submit" [disabled]="isPasswordLoading() || passwordForm.invalid"
              class="px-12 py-4 bg-neutral-900 dark:bg-slate-700 text-white rounded-2xl font-bold hover:bg-neutral-800 dark:hover:bg-slate-600 transition-all shadow-xl shadow-neutral-100 dark:shadow-none disabled:opacity-50">
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
