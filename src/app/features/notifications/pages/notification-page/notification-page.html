<div class="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
  <h1 class="text-3xl font-black text-neutral-800">Notifications</h1>

  <div class="bg-white rounded-[2.5rem] border border-neutral-100 shadow-sm overflow-hidden">
    <div class="divide-y divide-neutral-50">
      <div *ngFor="let n of notifications" class="p-8 hover:bg-neutral-50 transition-colors cursor-pointer flex gap-6">
        <div [class]="n.color" class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shrink-0">
          <i [class]="n.icon"></i>
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-start mb-1">
            <h3 class="font-bold text-neutral-800">{{ n.title }}</h3>
            <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-widest">{{ n.time }}</span>
          </div>
          <p class="text-sm text-neutral-500 leading-relaxed">{{ n.message }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
