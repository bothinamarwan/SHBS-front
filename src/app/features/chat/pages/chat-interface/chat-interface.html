<div class="h-[calc(100vh-12rem)] bg-white rounded-[2.5rem] border border-neutral-100 shadow-xl overflow-hidden flex animate-in fade-in slide-in-from-bottom-4 duration-700">
  <!-- Chat List Sidebar -->
  <aside class="w-80 border-r border-neutral-100 flex flex-col bg-neutral-50/30">
    <div class="p-6 border-b border-neutral-100 bg-white">
      <h2 class="text-xl font-bold text-neutral-800">Messages</h2>
      <div class="mt-4 relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-sm"></i>
        <input type="text" placeholder="Search chats..."
          class="w-full pl-10 pr-4 py-2 bg-neutral-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto">
      <div *ngFor="let chat of chats" 
        (click)="selectedChat.set(chat)"
        [class.bg-white]="selectedChat()?.id === chat.id" [class.shadow-sm]="selectedChat()?.id === chat.id"
        class="p-4 flex gap-4 cursor-pointer hover:bg-white transition-all border-b border-neutral-50">
        <div class="relative">
          <img [src]="chat.avatar" class="w-12 h-12 rounded-full border-2 border-white shadow-sm" alt="">
          <div *ngIf="chat.unread > 0" class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">
            {{ chat.unread }}
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-start mb-0.5">
            <h4 class="font-bold text-neutral-800 text-sm truncate">{{ chat.name }}</h4>
            <span class="text-[10px] font-medium text-neutral-400">{{ chat.time }}</span>
          </div>
          <p class="text-xs text-neutral-400 truncate">{{ chat.lastMessage }}</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Chat Bubble Area -->
  <main class="flex-1 flex flex-col bg-white">
    <div *ngIf="selectedChat() as chat" class="flex-1 flex flex-col min-w-0">
      <!-- Chat Header -->
      <header class="p-4 sm:p-6 border-b border-neutral-100 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img [src]="chat.avatar" class="w-10 h-10 rounded-full" alt="">
          <div>
            <h3 class="font-bold text-neutral-800 leading-none">{{ chat.name }}</h3>
            <span class="text-[10px] text-emerald-500 font-bold uppercase tracking-wider">Online</span>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="p-2 text-neutral-400 hover:text-indigo-600 hover:bg-neutral-50 rounded-xl transition-all">
            <i class="fas fa-phone-alt"></i>
          </button>
          <button class="p-2 text-neutral-400 hover:text-indigo-600 hover:bg-neutral-50 rounded-xl transition-all">
            <i class="fas fa-ellipsis-v"></i>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-neutral-50/10">
        <div *ngFor="let msg of messages" class="flex" [class.justify-end]="msg.sender === 'student'">
          <div class="max-w-[70%] space-y-1">
            <div [class.bg-indigo-600]="msg.sender === 'student'" [class.text-white]="msg.sender === 'student'"
              [class.bg-white]="msg.sender === 'landlord'" [class.text-neutral-800]="msg.sender === 'landlord'"
              [class.rounded-br-none]="msg.sender === 'student'" [class.rounded-bl-none]="msg.sender === 'landlord'"
              class="px-5 py-3 rounded-2xl shadow-sm border border-neutral-100/50">
              <p class="text-sm leading-relaxed">{{ msg.text }}</p>
            </div>
            <div class="flex items-center gap-2" [class.justify-end]="msg.sender === 'student'">
              <span class="text-[10px] text-neutral-400 font-medium">{{ msg.time }}</span>
              <i *ngIf="msg.sender === 'student'" class="fas fa-check-double text-[10px]" [class.text-indigo-600]="msg.isRead" [class.text-neutral-300]="!msg.isRead"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <footer class="p-6 border-t border-neutral-100">
        <div class="flex items-center gap-4 bg-neutral-50 p-2 pl-4 rounded-2xl border border-neutral-100 focus-within:border-indigo-600 transition-all">
          <button class="text-neutral-400 hover:text-indigo-600"><i class="fas fa-paperclip"></i></button>
          <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Type a message..."
            class="flex-1 bg-transparent border-none text-sm focus:ring-0">
          <button (click)="sendMessage()" class="w-10 h-10 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center justify-center">
            <i class="fas fa-paper-plane text-sm"></i>
          </button>
        </div>
      </footer>
    </div>

    <!-- No Chat Selected State -->
    <div *ngIf="!selectedChat()" class="flex-1 flex flex-col items-center justify-center text-center p-12">
      <div class="w-24 h-24 bg-neutral-50 rounded-full flex items-center justify-center mb-6 text-neutral-200">
        <i class="fas fa-comments text-4xl"></i>
      </div>
      <h3 class="text-xl font-bold text-neutral-800">Your Conversations</h3>
      <p class="text-neutral-500 mt-2 max-w-xs">Select a landlord from the list to start chatting about your potential stay.</p>
    </div>
  </main>
</div>
