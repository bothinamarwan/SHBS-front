<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 animate-in fade-in zoom-in-95 duration-500">
  
  <!-- Processing State -->
  <div *ngIf="status() === 'processing'" class="text-center">
    <div class="relative w-24 h-24 mx-auto mb-8">
      <div class="absolute inset-0 border-4 border-indigo-100 dark:border-indigo-900/30 rounded-full"></div>
      <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
    </div>
    <h2 class="text-2xl font-black text-neutral-800 dark:text-slate-100">Verifying Payment...</h2>
    <p class="text-neutral-500 mt-2">Please wait while we confirm your transaction securely.</p>
  </div>

  <!-- Success State -->
  <div *ngIf="status() === 'success'" class="max-w-md w-full bg-white dark:bg-slate-900 p-10 rounded-[2.5rem] border border-emerald-100 dark:border-emerald-900/30 shadow-2xl text-center relative overflow-hidden animate-in zoom-in duration-300">
    <div class="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
    <div class="w-20 h-20 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-check text-4xl"></i>
    </div>
    <h2 class="text-3xl font-black text-neutral-800 dark:text-slate-100 tracking-tight">Payment Successful!</h2>
    <p class="mt-3 text-neutral-500 dark:text-slate-400">Your transaction has been securely processed and your booking is now active.</p>
    
    <div class="mt-8 pt-6 border-t border-neutral-100 dark:border-slate-800">
      <a routerLink="/student/receipts" class="inline-flex w-full items-center justify-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-indigo-200 dark:shadow-none">
        View Receipt
      </a>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="status() === 'error'" class="max-w-md w-full bg-white dark:bg-slate-900 p-10 rounded-[2.5rem] border border-rose-100 dark:border-rose-900/30 shadow-2xl text-center relative overflow-hidden animate-in zoom-in duration-300">
    <div class="absolute top-0 left-0 w-full h-2 bg-rose-500"></div>
    <div class="w-20 h-20 bg-rose-50 dark:bg-rose-900/30 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-times text-4xl"></i>
    </div>
    <h2 class="text-3xl font-black text-neutral-800 dark:text-slate-100 tracking-tight">Payment Failed</h2>
    <p class="mt-3 text-neutral-500 dark:text-slate-400">{{ errorMessage() }}</p>
    
    <div class="mt-8 pt-6 border-t border-neutral-100 dark:border-slate-800 space-y-3">
      <a routerLink="/student/bookings" class="inline-flex w-full items-center justify-center py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-indigo-200 dark:shadow-none">
        Try Again
      </a>
      <a routerLink="/student" class="inline-flex w-full items-center justify-center py-4 bg-neutral-100 hover:bg-neutral-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-neutral-600 dark:text-slate-300 rounded-2xl font-bold transition-all">
        Go Home
      </a>
    </div>
  </div>

</div>
