<div class="max-w-4xl mx-auto p-8">
  <div class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-extrabold text-neutral-800 dark:text-slate-100">Notifications</h1>
      <p class="text-neutral-500 dark:text-slate-400 mt-2">Stay updated with platform activity</p>
    </div>
    <button *ngIf="unseenCount() > 0" (click)="markAllAsSeen()" 
      class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all text-sm">
      Mark All as Seen
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="space-y-4">
    <div *ngFor="let i of [1,2,3]" class="animate-pulse">
      <div class="bg-neutral-100 dark:bg-slate-800 h-24 rounded-2xl"></div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && notifications().length === 0" class="bg-white dark:bg-slate-900 p-12 rounded-[2rem] border border-dashed border-neutral-200 dark:border-slate-800 text-center">
    <div class="w-16 h-16 bg-neutral-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-bell-slash text-2xl text-neutral-400"></i>
    </div>
    <h3 class="text-lg font-bold text-neutral-800 dark:text-slate-100 mb-2">No notifications</h3>
    <p class="text-neutral-500 dark:text-slate-400">You're all caught up!</p>
  </div>

  <!-- Notifications List -->
  <div *ngIf="!isLoading() && notifications().length > 0" class="space-y-4">
    <div *ngFor="let notification of notifications()" 
      [class.bg-indigo-50]="!notification.isSeen"
      [class.dark:bg-indigo-900/10]="!notification.isSeen"
      class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-neutral-100 dark:border-slate-800 shadow-sm transition-all">
      
      <div class="flex items-start gap-4">
        <!-- Icon -->
        <div [class]="getTypeClass(notification.type)" class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0">
          <i [class]="'fas ' + getTypeIcon(notification.type)"></i>
        </div>
        
        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1">
              <p class="text-neutral-800 dark:text-slate-100 font-medium leading-relaxed">
                {{ notification.message }}
              </p>
              <p class="text-xs text-neutral-400 dark:text-slate-500 mt-2">
                {{ notification.createdAt | date:'medium' }}
              </p>
            </div>
            
            <!-- Actions -->
            <div class="flex items-center gap-2 flex-shrink-0">
              <button *ngIf="!notification.isSeen" (click)="markAsSeen(notification.notificationId)" 
                class="text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 transition-colors p-2"
                title="Mark as seen">
                <i class="fas fa-check"></i>
              </button>
              <button (click)="deleteNotification(notification.notificationId)" 
                class="text-rose-600 hover:text-rose-800 dark:text-rose-400 dark:hover:text-rose-300 transition-colors p-2"
                title="Delete">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          
          <!-- Type Badge -->
          <div class="mt-3">
            <span [class]="getTypeClass(notification.type)" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold">
              {{ notification.type }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
