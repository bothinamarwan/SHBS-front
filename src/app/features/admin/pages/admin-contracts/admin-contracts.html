<div class="mb-8">
  <h1 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100">Contract Review</h1>
  <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
    Review and approve or reject contracts
  </p>
</div>

<!-- Loading State -->
<div *ngIf="isLoading()" class="flex flex-col items-center justify-center py-20">
  <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
  <p class="text-sm text-slate-500 font-medium">Loading contracts...</p>
</div>

<!-- Main Content -->
<div *ngIf="!isLoading()">
  
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden mb-6">
    <!-- Header -->
    <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-file-contract text-slate-400"></i>
        <h2 class="font-bold text-slate-800 dark:text-slate-200">Contracts Pending Review</h2>
        <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold px-2.5 py-0.5 rounded-full">
          {{ contracts().length }}
        </span>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="contracts().length === 0" class="p-10 text-center">
      <div class="flex flex-col items-center justify-center text-slate-400">
        <i class="fas fa-file-contract text-3xl mb-3"></i>
        <p class="text-sm font-medium">No contracts pending review</p>
      </div>
    </div>

    <!-- Contracts List -->
    <div *ngIf="contracts().length > 0" class="divide-y divide-slate-200 dark:divide-slate-800">
      <div *ngFor="let contract of contracts()" class="p-5 hover:bg-slate-50 dark:hover:bg-slate-800/20 transition-colors flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
            <i class="fas fa-file-contract"></i>
          </div>
          <div>
            <div class="font-bold text-slate-800 dark:text-slate-200 text-sm font-mono">
              {{ contract.contractId.split('-')[0] }}...
            </div>
            <div class="text-xs text-slate-500">Booking ID: {{ contract.bookingId.split('-')[0] }}...</div>
          </div>
        </div>
        <button (click)="openReviewModal(contract)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors">
          Review
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Review Modal -->
<div *ngIf="isModalOpen()" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100">Review Contract</h2>
      <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Admin User ID</label>
        <input type="text" formControlName="adminUserId" [formGroup]="approvalForm" 
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <!-- Approval Section -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Approval Notes (Optional)</label>
        <textarea formControlName="notes" [formGroup]="approvalForm" rows="3"
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                  placeholder="Add any notes for approval..."></textarea>
      </div>

      <button (click)="approveContract()" 
              class="w-full mb-4 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-check-circle"></i>
        Approve Contract
      </button>

      <div class="border-t border-slate-200 dark:border-slate-800 my-4"></div>

      <!-- Rejection Section -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Rejection Notes (Required)</label>
        <textarea formControlName="notes" [formGroup]="rejectionForm" rows="3"
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                  placeholder="Please provide reason for rejection..."></textarea>
      </div>

      <button (click)="rejectContract()" 
              class="w-full px-4 py-3 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-times-circle"></i>
        Reject Contract
      </button>
    </div>
  </div>
</div>
