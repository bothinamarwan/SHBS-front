<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 glass-header shadow-[0_8px_40px_rgba(38,44,81,0.06)] h-20">
  <div class="flex items-center justify-between px-8 h-full max-w-[1440px] mx-auto font-['Manrope'] antialiased">

    <!-- Logo + Nav Links -->
    <div class="flex items-center gap-12">
      <a routerLink="/" id="nav-logo" class="flex items-center gap-2 no-underline">
        <span class="material-symbols-outlined text-primary text-3xl">home_work</span>
        <span class="text-2xl font-extrabold tracking-tight text-blue-800">AcademicAbode</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-blue-700 font-bold border-b-2 border-blue-700"
           [routerLinkActiveOptions]="{exact: true}"
           id="nav-home"
           class="text-slate-500 font-medium hover:text-blue-600 transition-all duration-300 pb-1">
          Home
        </a>
        <a routerLink="/listings" routerLinkActive="text-blue-700 font-bold border-b-2 border-blue-700"
           id="nav-listings"
           class="text-slate-500 font-medium hover:text-blue-600 transition-all duration-300 pb-1">
          Browse Listings
        </a>
        <a href="#universities"
           id="nav-universities"
           class="text-slate-500 font-medium hover:text-blue-600 transition-all duration-300 pb-1">
          Universities
        </a>
      </div>
    </div>

    <!-- Auth Buttons -->
    <div class="flex items-center gap-3">
      <a routerLink="/auth/login"
         id="nav-signin"
         class="hidden md:inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-semibold text-blue-800

                transition-all duration-300 no-underline">
        <span class="material-symbols-outlined text-base leading-none">login</span>

      </a>
      <a routerLink="/auth/register"
         id="nav-signup"
         class="hidden md:inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-semibold text-white

                active:scale-95 transition-all duration-300 no-underline">
        <span class="material-symbols-outlined text-base leading-none">person_add</span>
        Get Started
      </a>

      <!-- Mobile hamburger -->
      <button id="nav-mobile-menu"
              class="md:hidden p-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>

  </div>
