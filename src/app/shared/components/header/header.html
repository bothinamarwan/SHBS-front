<!-- Floating Pill NavBar -->
<div class="fixed top-5 left-0 w-full z-50 px-4 flex justify-center pointer-events-none">
  <nav class="nav-pill pointer-events-auto">
    <div class="nav-inner">

      <!-- Logo -->
      <a routerLink="/" id="nav-logo" class="nav-logo">
        <div class="logo-icon">
          <span class="material-symbols-outlined">home_work</span>
        </div>
        <span class="logo-text">UniStay</span>
      </a>

      <!-- Divider -->
      <div class="nav-divider"></div>

      <!-- Nav Links (desktop) -->
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="nav-link--active"
           [routerLinkActiveOptions]="{exact: true}"
           id="nav-home" class="nav-link">
          <span class="material-symbols-outlined nav-link-icon">cottage</span>
          <span class="nav-link-label">Home</span>
        </a>
        <a routerLink="/listings" routerLinkActive="nav-link--active"
           id="nav-listings" class="nav-link">
          <span class="material-symbols-outlined nav-link-icon">apartment</span>
          <span class="nav-link-label">Listings</span>
        </a>
        <a href="#universities" id="nav-universities" class="nav-link">
          <span class="material-symbols-outlined nav-link-icon">school</span>
          <span class="nav-link-label">Universities</span>
        </a>
      </div>

      <!-- Right Side Actions -->
      <div class="nav-actions">
        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" class="nav-icon-btn" aria-label="Toggle theme">
          <span class="material-symbols-outlined">{{ isDark() ? 'light_mode' : 'dark_mode' }}</span>
        </button>

        @if (!isAuthenticated()) {
          <!-- Sign In -->
          <a routerLink="/auth/login" id="nav-signin" class="nav-ghost-btn">
            Sign In
          </a>
          <!-- Get Started -->
          <a routerLink="/auth/register" id="nav-signup" class="nav-cta-btn">
            Get Started
          </a>
        } @else {
          <a routerLink="/student" class="nav-ghost-btn">Dashboard</a>
          <button (click)="logout()" class="nav-logout-btn">
            <span class="material-symbols-outlined">logout</span>
          </button>
        }

        <!-- Mobile Hamburger -->
        <button (click)="toggleMenu()" id="nav-mobile-menu" class="nav-icon-btn lg:hidden">
          <span class="material-symbols-outlined">{{ menuOpen() ? 'close' : 'menu' }}</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- Mobile Dropdown -->
  @if (menuOpen()) {
    <div class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-section-label">Navigation</span>
        <button (click)="toggleTheme()" class="mobile-theme-btn">
          <span class="material-symbols-outlined">{{ isDark() ? 'light_mode' : 'dark_mode' }}</span>
          {{ isDark() ? 'Light' : 'Dark' }}
        </button>
      </div>

      <a routerLink="/" (click)="toggleMenu()" class="mobile-link">
        <span class="material-symbols-outlined">cottage</span> Home
      </a>
      <a routerLink="/listings" (click)="toggleMenu()" class="mobile-link">
        <span class="material-symbols-outlined">apartment</span> Browse Listings
      </a>

      <div class="mobile-divider"></div>

      @if (!isAuthenticated()) {
        <a routerLink="/auth/login" (click)="toggleMenu()" class="mobile-link">
          <span class="material-symbols-outlined">login</span> Sign In
        </a>
        <a routerLink="/auth/register" (click)="toggleMenu()" class="mobile-cta">
          Get Started →
        </a>
      } @else {
        <a routerLink="/student" (click)="toggleMenu()" class="mobile-link">
          <span class="material-symbols-outlined">dashboard</span> Dashboard
        </a>
        <button (click)="logout()" class="mobile-link mobile-link--danger">
          <span class="material-symbols-outlined">logout</span> Sign Out
        </button>
      }
    </div>
  }
</div>
